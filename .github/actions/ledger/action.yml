name: ledger
description: Keeps one Ledger row (L29) for an agent run as the artifact ledger-<run id>-<attempt>-<role>-<slug>, which loop/retro.sh reads. It runs main's copy of the scripts, so a branch cannot change its own row.
inputs:
  role:
    description: builder, reviewer, retro or feedback
    required: true
  subject:
    description: the Work row's ids, the PR number, or retro
    required: true
  execution-file:
    description: claude-code-action's execution_file output; empty when the run never started
    required: false
    default: ''
  redact-token:
    description: Action token to redact from the retained final explanation
    required: false
    default: ''
  redact-oauth:
    description: Observer OAuth token to redact from the retained final explanation
    required: false
    default: ''
  redact-percy:
    description: Percy credential to redact from the retained final explanation
    required: false
    default: ''
  redact-typesafe:
    description: TypeSafe credential to redact from the retained final explanation
    required: false
    default: ''
  conclusion:
    description: the claude-code-action step's outcome; empty reads as failure
    required: false
    default: ''
outputs:
  explanation:
    description: the run's redacted final model explanation as one line of JSON (L92)
    value: ${{ steps.row.outputs.explanation }}
runs:
  using: composite
  steps:
    - id: row
      shell: bash
      env:
        ROLE: ${{ inputs.role }}
        SUBJECT: ${{ inputs.subject }}
        EXECUTION_FILE: ${{ inputs.execution-file }}
        CONCLUSION: ${{ inputs.conclusion }}
        GH_TOKEN: ${{ github.token }}
        PERCY_TOKEN: ${{ inputs.redact-percy }}
        TYPESAFE_API_KEY: ${{ inputs.redact-typesafe }}
        ACTION_GITHUB_TOKEN: ${{ inputs.redact-token }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.redact-oauth }}
      run: |
        mkdir -p "$RUNNER_TEMP/ledger/loop"
        git -C "$GITHUB_ACTION_PATH" show HEAD:loop/retro.sh >"$RUNNER_TEMP/ledger/loop/retro.sh"
        git -C "$GITHUB_ACTION_PATH" show HEAD:loop/runs.sh >"$RUNNER_TEMP/ledger/loop/runs.sh"
        git -C "$GITHUB_ACTION_PATH" show HEAD:loop/lib.sh >"$RUNNER_TEMP/ledger/loop/lib.sh"
        bash "$RUNNER_TEMP/ledger/loop/retro.sh" ledger "$ROLE" "$SUBJECT" "$EXECUTION_FILE" "${CONCLUSION:-failure}" >"$RUNNER_TEMP/ledger/ledger.json"
        cat "$RUNNER_TEMP/ledger/ledger.json"
        git -C "$GITHUB_ACTION_PATH" show HEAD:loop/outcome.py >"$RUNNER_TEMP/ledger/loop/outcome.py"
        git -C "$GITHUB_ACTION_PATH" show HEAD:loop/dispatch.py >"$RUNNER_TEMP/ledger/loop/dispatch.py"
        git -C "$GITHUB_ACTION_PATH" show HEAD:loop/trail.py >"$RUNNER_TEMP/ledger/loop/trail.py"
        # L92: the redacted final explanation goes to the run's completion job, which posts it to the Issue's Trail.
        echo "explanation=$(python3 "$RUNNER_TEMP/ledger/loop/outcome.py" explain "$EXECUTION_FILE")" >>"$GITHUB_OUTPUT"
        slug=$(bash "$RUNNER_TEMP/ledger/loop/runs.sh" slug "$SUBJECT")
        echo "slug=$slug" >>"$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: ledger-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.role }}-${{ steps.row.outputs.slug }}
        path: |
          ${{ runner.temp }}/ledger/ledger.json
        retention-days: 90
