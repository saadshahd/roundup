name: setup
description: The toolchain `just check` needs on a macOS runner, with the workspace's packages installed.
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.99.0
        components: clippy, rustfmt
    # One key for every job that builds the workspace. `check` is the check job's own key, so Builders restore the
    # entries main's check saved. Only a push to main saves: a PR or a Builder branch would store its own 726 MB copy.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: check
        save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    - uses: taiki-e/install-action@nextest
    - uses: taiki-e/install-action@cargo-machete
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: GNU coreutils and jq
      shell: bash
      run: |
        brew install coreutils jq
        echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
    - uses: taiki-e/install-action@just
    - shell: bash
      run: pnpm install --frozen-lockfile
