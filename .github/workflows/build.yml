name: build

# L23: one-shot Builder runs. GitHub does the waiting: a tick builds up to four ready Work rows, and a dispatch with a
# PR number makes the one fix run after its first reject (loop/runs.sh verdict sends it). Each run ends with its PR.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: A PR to fix after its first reject; empty builds ready rows
        required: false
        default: ''
      max:
        description: Builder runs at most
        required: false
        default: '4'

# One queue at a time: a row is in flight only once its PR exists, so a second queue would build it twice.
concurrency:
  group: build-${{ inputs.pr || 'queue' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  queue:
    if: ${{ !inputs.pr }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rows: ${{ steps.queue.outputs.rows }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          MAX: ${{ inputs.max || '4' }}
        run: |
          rows=$(loop/runs.sh queue "$MAX")
          echo "rows=$rows" >>"$GITHUB_OUTPUT"

  # The Builder pushes and opens its PR with the Claude App's token, so CI runs on it; the checkout keeps no token.
  build:
    needs: queue
    if: needs.queue.outputs.rows != '[]'
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.queue.outputs.rows) }}
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: prompt
        env:
          IDS: ${{ matrix.row.ids }}
          FILE: ${{ matrix.row.file }}
          SLUG: ${{ matrix.row.slug }}
        run: |
          printf 'Build Work row %s of %s on branch build/%s. Your Author-Agent id is builder-%s.\n' "$IDS" "$FILE" "$SLUG" "$GITHUB_RUN_ID" |
            loop/runs.sh prompt builder
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude,github-actions
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 150
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,Skill,TodoWrite
      - if: always()
        uses: ./.github/actions/ledger
        with:
          role: builder
          subject: ${{ matrix.row.ids }}
          execution-file: ${{ steps.claude.outputs.execution_file }}
          conclusion: ${{ steps.claude.outcome }}

  fix:
    if: ${{ inputs.pr }}
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          branch=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName,state --jq 'select(.state == "OPEN") | .headRefName')
          [ -n "$branch" ] || { echo "PR #$PR is not open" >&2; exit 1; }
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          {
            printf 'Fix PR #%s on branch %s: answer every finding of the reject below and push. Your Author-Agent id is builder-%s.\n\n' "$PR" "$BRANCH" "$GITHUB_RUN_ID"
            loop/rules.sh verdicts "$PR" | jq -r 'select(.verdict == "reject") | .body'
          } | loop/runs.sh prompt builder
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude,github-actions
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 100
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,Skill,TodoWrite
      - if: always()
        uses: ./.github/actions/ledger
        with:
          role: builder
          subject: ${{ inputs.pr }}
          execution-file: ${{ steps.claude.outputs.execution_file }}
          conclusion: ${{ steps.claude.outcome }}
