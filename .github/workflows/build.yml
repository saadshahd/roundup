name: build
run-name: Build ready work Issues

# L23: one-shot build runs. `pick` starts the fix runs open Builder PRs need and fills the free build slots, up to
# `MAX`, with ready work Issues. Each Issue runs build-issue.yml, whose own `after` starts the next pick as soon as
# that Issue's model did work, so the slots work as a pool rather than a batch.
# claude-code-action rejects push events, so a merge starts the build once `check` ends on `main`. The user's or a loop
# App's new or reopened Issue and a removed `flag:needs-user` each add work (L34), so each starts a pick.
on:
  workflow_run:
    workflows: [check]
    branches: [main]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  issues:
    types: [opened, reopened, unlabeled]
  workflow_dispatch:
    inputs:
      max:
        description: Build jobs at most
        required: false
        default: '16'

permissions:
  contents: read

# L82: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # One pick at a time, so two triggers never start one Issue twice; build jobs of earlier runs keep running.
  pick:
    if: >-
      github.event_name != 'issues' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'flag:needs-user') ||
      (contains(fromJSON('["opened", "reopened"]'), github.event.action) &&
       contains(fromJSON('["saadshahd", "claude[bot]", "github-actions[bot]"]'), github.event.issue.user.login))
    runs-on: ubuntu-latest
    concurrency:
      group: build-pick
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    outputs:
      rows: ${{ steps.pick.outputs.rows }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          MAX: ${{ inputs.max || '16' }}
        run: echo "rows=$(python3 loop/builder.py pick "$MAX")" >>"$GITHUB_OUTPUT"

  # Each Issue's build and its own `after` run in build-issue.yml, so one Issue's end never waits on another's.
  build:
    needs: pick
    if: needs.pick.outputs.rows != '[]'
    name: 'build #${{ matrix.row.issue }}'
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.pick.outputs.rows) }}
    # The union of what build-issue.yml's jobs need; its build job narrows to read access, so the Builder holds no write.
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/build-issue.yml
    with:
      issue: ${{ matrix.row.issue }}
      slug: ${{ matrix.row.slug }}
    secrets: inherit

  summary:
    needs: [pick, build]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Build ready work Issues
      next: Each PR goes through check and review to auto-merge; a draft with a Stopped line waits on the user.
