name: build
run-name: "${{ inputs.pr && format('Repair PR #{0}', inputs.pr) || 'Build ready rows' }}"

# L23: one-shot Builder runs. GitHub does the waiting: a tick claims ready Work rows while up to four Builders run
# across all ticks, and a dispatch with a PR number makes the one fix run after its first reject (loop/runs.sh verdict
# sends it). Each run ends with its PR.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: A PR to fix after its first reject; empty builds ready rows
        required: false
        default: ''
      head:
        description: Expected PR head; stale dispatches do no work
        required: false
      max:
        description: Builder runs at most
        required: false
        default: '4'

permissions:
  contents: read

# L82: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # One queue job at a time, so two ticks never claim one row; Builders of earlier ticks keep running meanwhile.
  # Its checkout keeps the token that pushes the Claims; it runs main's scripts only.
  queue:
    if: ${{ !inputs.pr }}
    runs-on: ubuntu-latest
    concurrency:
      group: build-queue
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pull-requests: read
    outputs:
      rows: ${{ steps.queue.outputs.rows }}
    steps:
      - uses: actions/checkout@v4
      - id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          MAX: ${{ inputs.max || '4' }}
        run: |
          rows=$(loop/runs.sh queue "$MAX" | loop/runs.sh claim)
          echo "rows=$rows" >>"$GITHUB_OUTPUT"

  build:
    needs: queue
    if: needs.queue.outputs.rows != '[]'
    name: build (${{ matrix.row.ids }}, ${{ matrix.row.file }}, ${{ matrix.row.slug }})
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.queue.outputs.rows) }}
    uses: ./.github/workflows/build-row.yml
    with:
      row: ${{ toJSON(matrix.row) }}
    secrets: inherit
    # The reusable workflow narrows the agent job to read; only its after job can dispatch/write.
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write

  # Trusted main owns the Claim and constructs the task before PR code is checked out.
  repair-due:
    if: ${{ inputs.pr }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
      checks: read
    outputs:
      branch: ${{ steps.due.outputs.branch }}
      prompt: ${{ steps.due.outputs.prompt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: due
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HEAD: ${{ inputs.head }}
          CODEX_STATUS: ${{ vars.LOOP_CODEX_STATUS }}
        run: python3 loop/dispatch.py start "$PR" fix "$HEAD"

  fix:
    needs: repair-due
    if: needs.repair-due.outputs.branch != ''
    concurrency:
      group: build-${{ inputs.pr }}
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      branch: ${{ needs.repair-due.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair-due.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ needs.repair-due.outputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude,github-actions
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 100
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,Skill,TodoWrite
      - if: always()
        uses: ./.github/actions/ledger
        with:
          role: builder
          subject: ${{ inputs.pr }}
          execution-file: ${{ steps.claude.outputs.execution_file }}
          conclusion: ${{ steps.claude.outcome }}

  # After a fix run ends, however it ends: asks the user about its PR if the run left it a draft (L81).
  after-fix:
    needs: fix
    if: always() && needs.fix.outputs.branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.fix.outputs.branch }}
        run: loop/runs.sh stopped "$BRANCH"
