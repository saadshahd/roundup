name: build

# L23: one-shot Builder runs. GitHub does the waiting: a tick claims ready Work rows while up to four Builders run
# across all ticks, and a dispatch with a PR number makes the one fix run after its first reject (loop/runs.sh verdict
# sends it). Each run ends with its PR.
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: A PR to fix after its first reject; empty builds ready rows
        required: false
        default: ''
      max:
        description: Builder runs at most
        required: false
        default: '4'

permissions:
  contents: read

# L82: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # One queue job at a time, so two ticks never claim one row; Builders of earlier ticks keep running meanwhile.
  # Its checkout keeps the token that pushes the Claims; it runs main's scripts only.
  queue:
    if: ${{ !inputs.pr }}
    runs-on: ubuntu-latest
    concurrency:
      group: build-queue
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pull-requests: read
    outputs:
      rows: ${{ steps.queue.outputs.rows }}
    steps:
      - uses: actions/checkout@v4
      - id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          MAX: ${{ inputs.max || '4' }}
        run: |
          rows=$(loop/runs.sh queue "$MAX" | loop/runs.sh claim)
          echo "rows=$rows" >>"$GITHUB_OUTPUT"

  # The Builder pushes and opens its PR with the Claude App's token, so CI runs on it; the checkout keeps no token.
  build:
    needs: queue
    if: needs.queue.outputs.rows != '[]'
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.queue.outputs.rows) }}
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - id: prompt
        env:
          IDS: ${{ matrix.row.ids }}
          FILE: ${{ matrix.row.file }}
          SLUG: ${{ matrix.row.slug }}
        run: |
          printf 'Build Work row %s of %s on branch build/%s. That branch exists at an older main commit as the row'"'"'s Claim: branch from origin/main and push, which fast-forwards it. Your Author-Agent id is builder-%s.\n' "$IDS" "$FILE" "$SLUG" "$GITHUB_RUN_ID" |
            loop/runs.sh prompt builder
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude,github-actions
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 150
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,Skill,TodoWrite
      - if: always()
        uses: ./.github/actions/ledger
        with:
          role: builder
          subject: ${{ matrix.row.ids }}
          execution-file: ${{ steps.claude.outputs.execution_file }}
          conclusion: ${{ steps.claude.outcome }}

  # After the tick's Builders end, however they end: frees each Claim whose Builder opened no PR, so the next tick builds
  # that row again, and asks the user about each PR a Builder left a draft (L81). The Builders hold none of these scopes.
  after:
    needs: [queue, build]
    if: always() && needs.queue.result == 'success' && needs.queue.outputs.rows != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          ROWS: ${{ needs.queue.outputs.rows }}
        run: |
          printf '%s' "$ROWS" | loop/runs.sh unclaim
          jq -r '.[] | "build/\(.slug)"' <<<"$ROWS" | xargs loop/runs.sh stopped
      # Refill only after a ready PR was delivered. Empty queues and runs that produced no ready PR end the chain.
      - if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ROWS: ${{ needs.queue.outputs.rows }}
        run: |
          prs=$(gh pr list --state open --json headRefName,isDraft)
          if jq -e --argjson rows "$ROWS" 'any(.[]; . as $pr | ($pr.isDraft | not) and any($rows[]; $pr.headRefName == "build/\(.slug)"))' <<<"$prs" >/dev/null; then
            gh workflow run build.yml
          fi

  # One fix run per PR at a time.
  fix:
    if: ${{ inputs.pr }}
    concurrency:
      group: build-${{ inputs.pr }}
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          branch=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName,state --jq 'select(.state == "OPEN") | .headRefName')
          [ -n "$branch" ] || { echo "PR #$PR is not open" >&2; exit 1; }
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          {
            printf 'Fix PR #%s on branch %s: answer every finding of the reject below and push. Your Author-Agent id is builder-%s.\n\n' "$PR" "$BRANCH" "$GITHUB_RUN_ID"
            loop/rules.sh verdicts "$PR" | jq -r 'select(.verdict == "reject") | .body'
          } | loop/runs.sh prompt builder
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude,github-actions
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 100
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,Skill,TodoWrite
      - if: always()
        uses: ./.github/actions/ledger
        with:
          role: builder
          subject: ${{ inputs.pr }}
          execution-file: ${{ steps.claude.outputs.execution_file }}
          conclusion: ${{ steps.claude.outcome }}

  # After a fix run ends, however it ends: asks the user about its PR if the run left it a draft (L81).
  after-fix:
    needs: fix
    if: always() && needs.fix.outputs.branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.fix.outputs.branch }}
        run: loop/runs.sh stopped "$BRANCH"
