name: build
run-name: Build ready work Issues

# L23: one-shot build runs. `pick` starts the fix runs open Builder PRs need and fills up to four build jobs with ready
# work Issues; each build job builds one Issue. `after` holds the write token the Builder never sees: it hands each
# run's PR on, or strikes its Issue (L81).
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      max:
        description: Build jobs at most
        required: false
        default: '4'

permissions:
  contents: read

# L82: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # One pick at a time, so two triggers never start one Issue twice; build jobs of earlier runs keep running.
  pick:
    if: github.event_name != 'issues' || github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    concurrency:
      group: build-pick
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    outputs:
      rows: ${{ steps.pick.outputs.rows }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          MAX: ${{ inputs.max || '4' }}
        run: echo "rows=$(python3 loop/builder.py pick "$MAX")" >>"$GITHUB_OUTPUT"

  build:
    needs: pick
    if: needs.pick.outputs.rows != '[]'
    name: 'build #${{ matrix.row.issue }}'
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.pick.outputs.rows) }}
    # A second job for one Issue waits, then finds the first one's PR and starts no run.
    concurrency:
      group: build-${{ matrix.row.issue }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    env:
      ISSUE: ${{ matrix.row.issue }}
      SLUG: ${{ matrix.row.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # The Builder switches this checkout to its branch; the end of the job runs main's copy.
      - run: |
          cp -R loop "$RUNNER_TEMP/loop"
          mkdir "$RUNNER_TEMP/built"
          echo "{\"issue\": $ISSUE, \"slug\": \"$SLUG\", \"ran\": false}" >"$RUNNER_TEMP/built/$ISSUE.json"
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - name: Stamp Builder commits
        run: bash loop/author.sh "builder-$GITHUB_RUN_ID"
      - id: task
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=0
          python3 loop/orders.py task "$ISSUE" >"$RUNNER_TEMP/task.md" || code=$?
          # 3: another run or a person took the Issue since the pick; that ends this job with no run.
          [ "$code" != 3 ] || exit 0
          [ "$code" = 0 ] || exit "$code"
          printf '\nBuild on branch build/%s from origin/main. Your Author-Agent id is builder-%s.\n' "$SLUG" "$GITHUB_RUN_ID" >>"$RUNNER_TEMP/task.md"
          python3 loop/builder.py prompt <"$RUNNER_TEMP/task.md"
          echo 'due=true' >>"$GITHUB_OUTPUT"
      - id: claude
        if: steps.task.outputs.due == 'true'
        uses: anthropics/claude-code-action@v1
        # Isolated CLI observers use a fresh config and cannot inherit the action's stored login.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          prompt: ${{ steps.task.outputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude,github-actions
          # The App's default token omits workflows; writers need to publish proposed workflow changes.
          additional_permissions: |
            actions: read
            checks: read
            workflows: write
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 150
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,Skill,TodoWrite
      - if: always() && steps.task.outputs.due == 'true'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          ran=false
          if python3 "$RUNNER_TEMP/loop/builder.py" worked "$EXECUTION_FILE"; then ran=true; fi
          echo "{\"issue\": $ISSUE, \"slug\": \"$SLUG\", \"ran\": $ran}" >"$RUNNER_TEMP/built/$ISSUE.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-${{ matrix.row.issue }}
          path: ${{ runner.temp }}/built/${{ matrix.row.issue }}.json
          if-no-files-found: error
          retention-days: 7

  after:
    needs: [pick, build]
    if: always() && needs.pick.result == 'success' && needs.pick.outputs.rows != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: built-*
          path: ${{ runner.temp }}/built
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for row in "$RUNNER_TEMP"/built/*.json; do
            python3 loop/builder.py built "$(jq -r .issue "$row")" "$(jq -r .slug "$row")" "$(jq -r .ran "$row")"
          done

  summary:
    needs: [pick, build, after]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Build ready work Issues
      next: Each PR goes through check and review to auto-merge; a draft with a Stopped line waits on the user.
