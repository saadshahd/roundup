name: review
run-name: "Review PR #${{ inputs.pr || github.event.pull_request.number }}"

# L24: one Reviewer run per PR head, started when the PR opens, reopens or gets a push, draft or ready, whatever CI
# says. The Reviewer holds only a read token and answers in a fixed schema; the post job publishes that answer as the
# verdict merge-ready trusts, and the announce and finish jobs keep the head's labels and one activity comment. It runs
# on Opus, since a missed defect merges; Builders and the Retro run on Sonnet, whose misses the Reviewer or the user
# still sees. pull_request_target runs main's workflow; the head is only checked out, read-only, in the review job.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR needing review
        required: true
      head:
        description: Expected PR head
        required: true
  pull_request_target:
    types: [opened, reopened, synchronize]

# One group per PR head: duplicate events for a head queue behind its reviewer and the review Claim ends them, while a
# new head never waits behind an old head's reviewer.
concurrency:
  group: review-${{ inputs.pr || github.event.pull_request.number }}-${{ inputs.head || github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions:
  contents: read

# L82: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # Reads main's scripts and shared Builder prompt, never the PR's.
  due:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: write
      issues: write
    outputs:
      pr: ${{ steps.due.outputs.pr }}
      head: ${{ steps.due.outputs.head }}
      prompt: ${{ steps.due.outputs.prompt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: due
        env:
          GH_TOKEN: ${{ github.token }}
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          HEAD: ${{ inputs.head || github.event.pull_request.head.sha }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          CODEX_STATUS: ${{ vars.LOOP_CODEX_STATUS }}
        run: python3 loop/dispatch.py start "$PR" review "$HEAD"

  # At actual model startup, never while the job is queued: `reviewing` and the head's one activity comment.
  announce:
    needs: due
    if: needs.due.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.due.outputs.pr }}
          HEAD: ${{ needs.due.outputs.head }}
        run: python3 loop/dispatch.py announce "$PR" "$HEAD"

  review:
    needs: due
    if: needs.due.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    outputs:
      answer: ${{ steps.claude.outputs.structured_output }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.due.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install main's reviewer instructions
        run: git show origin/main:loop/review-checkout.sh | bash
      - id: claude
        uses: anthropics/claude-code-action@v1
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        with:
          prompt: ${{ needs.due.outputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: claude,github-actions
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools Bash,Read,Glob,Grep,Skill
            --json-schema '{"type":"object","properties":{"verdict":{"enum":["approve","reject"]},"findings":{"type":"string"}},"required":["verdict","findings"]}'
      # A git checkout tolerates skill symlinks that GitHub's remote-action archive loader rejects.
      - if: always()
        uses: actions/checkout@v4
        with:
          ref: main
          path: .loop-ledger
          sparse-checkout: |
            .github/actions/ledger
            loop
          persist-credentials: false
      - if: always()
        uses: ./.loop-ledger/.github/actions/ledger
        with:
          role: reviewer
          subject: ${{ needs.due.outputs.pr }}
          execution-file: ${{ steps.claude.outputs.execution_file }}
          redact-token: ${{ steps.claude.outputs.github_token }}
          redact-oauth: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          redact-percy: ${{ secrets.PERCY_TOKEN }}
          conclusion: ${{ steps.claude.outcome }}

  post:
    needs: [due, review]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.due.outputs.pr }}
          HEAD: ${{ needs.due.outputs.head }}
          ANSWER: ${{ needs.review.outputs.answer }}
        run: printf '%s' "$ANSWER" | loop/runs.sh verdict "$PR" "$HEAD" "reviewer-$GITHUB_RUN_ID"

  # Whatever happened to the other jobs: update the head's activity comment and labels; a lost review returns to
  # needs-review and reconciliation retries it within its bound.
  finish:
    needs: [due, announce, review, post]
    if: always() && needs.due.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.due.outputs.pr }}
          HEAD: ${{ needs.due.outputs.head }}
          REVIEW: ${{ needs.review.result }}
          POST: ${{ needs.post.result }}
          ANSWER: ${{ needs.review.outputs.answer }}
        run: python3 loop/dispatch.py finish "$PR" "$HEAD" "$REVIEW" "$POST" "$(jq -r '.verdict // empty' <<<"${ANSWER:-null}" 2>/dev/null || true)"
