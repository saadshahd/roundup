name: review
run-name: "${{ inputs.pr && format('Review PR #{0}', inputs.pr) || format('Review {0}', github.event.workflow_run.head_branch) }}"

# L24: one Reviewer run per Code PR head, once check passes on it. The Reviewer holds only a read token and answers in
# a fixed schema; the post job publishes that answer as the verdict merge-ready trusts. It runs on Opus, since a
# missed defect merges; Builders and the Retro run on Sonnet, whose misses the Reviewer or the user still sees.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR needing review
        required: true
      head:
        description: Expected PR head
        required: true
  workflow_run:
    workflows: [check, loop, visual]
    types: [completed]

# Duplicate review dispatches queue; the shared PR Claim prevents duplicate model runs.
concurrency:
  group: review-${{ inputs.pr || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

# L82: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # Reads main's scripts and shared Builder prompt, never the PR's.
  due:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
    outputs:
      pr: ${{ steps.due.outputs.pr }}
      head: ${{ steps.due.outputs.head }}
      prompt: ${{ steps.due.outputs.prompt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: due
        env:
          GH_TOKEN: ${{ github.token }}
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          HEAD: ${{ inputs.head || github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR: ${{ inputs.pr }}
          CODEX_STATUS: ${{ vars.LOOP_CODEX_STATUS }}
        run: |
          pr="$PR"
          if [ -z "$pr" ]; then
            pr=$(gh pr list --head "$BRANCH" --state open --json number,headRefOid --jq ".[] | select(.headRefOid == \"$HEAD\") | .number")
          fi
          [ -n "$pr" ] || exit 0
          python3 loop/dispatch.py start "$pr" review "$HEAD"

  review:
    needs: due
    if: needs.due.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      answer: ${{ steps.claude.outputs.structured_output }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.due.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install main's reviewer instructions
        run: git show origin/main:loop/review-checkout.sh | bash
      - id: claude
        uses: anthropics/claude-code-action@v1
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        with:
          prompt: ${{ needs.due.outputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: claude,github-actions
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools Bash,Read,Glob,Grep,Skill
            --json-schema '{"type":"object","properties":{"verdict":{"enum":["approve","reject"]},"findings":{"type":"string"}},"required":["verdict","findings"]}'
      - if: always()
        uses: saadshahd/roundup/.github/actions/ledger@main
        with:
          role: reviewer
          subject: ${{ needs.due.outputs.pr }}
          execution-file: ${{ steps.claude.outputs.execution_file }}
          redact-token: ${{ steps.claude.outputs.github_token }}
          redact-oauth: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          redact-percy: ${{ secrets.PERCY_TOKEN }}
          conclusion: ${{ steps.claude.outcome }}

  post:
    needs: [due, review]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.due.outputs.pr }}
          HEAD: ${{ needs.due.outputs.head }}
          ANSWER: ${{ needs.review.outputs.answer }}
        run: printf '%s' "$ANSWER" | loop/runs.sh verdict "$PR" "$HEAD" "reviewer-$GITHUB_RUN_ID"
