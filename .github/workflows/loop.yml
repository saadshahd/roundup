name: loop

on:
  pull_request:

concurrency:
  group: loop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: loop/rules.sh size origin/${{ github.base_ref }}
      - run: loop/rules.sh ci-trailers ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
      - run: loop/rules.sh vocab
      - run: loop/rules.test.sh
      - run: loop/merge-ready.test.sh
      - run: loop/boxd.test.sh
