name: loop

on:
  pull_request:

concurrency:
  group: loop-${{ github.ref }}
  cancel-in-progress: true

# L82: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: loop/rules.sh ci-trailers "$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
      - run: loop/rules.sh vocab
      - run: python3 loop/orders.py lint
      - run: python3 loop/orders.test.py
      - run: python3 loop/builder.test.py
      - run: loop/rules.test.sh
      - run: loop/percy.test.sh
      - run: loop/qa-sweep.test.sh

  summary:
    needs: [rules]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Check loop rules and regressions
      next: A failure blocks merge and starts a fix run on a Builder PR.
