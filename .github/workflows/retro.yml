name: retro

# L27: once 20 PRs have merged since the last Retro and none is open, one Retro run reads loop/retro.sh's report and
# opens one Retro PR on a retro/ branch. It passes independent review and the required gates.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

concurrency:
  group: retro
  cancel-in-progress: false

permissions:
  contents: read

# L82: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  retro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=0
          loop/retro.sh due || code=$?
          case $code in
            0) echo "due=true" >>"$GITHUB_OUTPUT" ;;
            1) ;;
            *) exit "$code" ;;
          esac
      - id: prompt
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          loop/retro.sh report >"$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >>"$GITHUB_STEP_SUMMARY"
          {
            printf 'Open one Retro PR on branch retro/%s from this report.\n\n' "$(date -u +%Y-%m-%d)"
            cat "$RUNNER_TEMP/report.md"
          } | loop/runs.sh prompt retro
      - id: claude
        if: steps.due.outputs.due == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The App's default token omits workflows; writers need to publish proposed workflow changes.
          additional_permissions: |
            actions: read
            checks: read
            workflows: write
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,Skill
      - if: always() && steps.due.outputs.due == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          path: .loop-ledger
          sparse-checkout: |
            .github/actions/ledger
            loop
          persist-credentials: false
      - if: always() && steps.due.outputs.due == 'true'
        uses: ./.loop-ledger/.github/actions/ledger
        with:
          role: retro
          subject: retro
          execution-file: ${{ steps.claude.outputs.execution_file }}
          redact-token: ${{ steps.claude.outputs.github_token }}
          redact-oauth: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          redact-typesafe: ${{ secrets.TYPESAFE_API_KEY }}
          conclusion: ${{ steps.claude.outcome }}

  summary:
    needs: [retro]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Evolve the loop from recorded results
      next: A proposed improvement gets independent review and required checks, then auto-merges.
