name: merge-ready

# Runs from the default branch's copy of this file and checks out the default branch only: a PR's
# own files are read as data and never executed (L46). The review workflow dispatches it after posting a verdict,
# since a comment posted with GITHUB_TOKEN starts no workflow.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [check, loop, visual]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true

permissions:
  contents: read
  statuses: write
  pull-requests: write
  checks: read

concurrency:
  group: merge-ready-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  # Not named merge-ready: a job of that name would also publish a check run with the status's name.
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: set the merge-ready status on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_FROM_PR: ${{ github.event.pull_request.number }}
          PR_FROM_COMMENT: ${{ github.event.issue.pull_request && github.event.issue.number }}
          PR_FROM_DISPATCH: ${{ inputs.pr }}
          PR_FROM_RUN: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          pr="${PR_FROM_PR:-${PR_FROM_COMMENT:-${PR_FROM_DISPATCH:-$PR_FROM_RUN}}}"
          [ -n "$pr" ] || { echo "no pull request for this event"; exit 0; }
          sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
          fail() {
            gh api "repos/$REPO/statuses/$sha" -f state=failure -f context=merge-ready -f description="$1"
            echo "$1" >&2
            exit 1
          }
          paths=$(gh pr diff "$pr" --name-only) || fail "merge-ready: cannot read the PR diff"
          # L78: the user merges loop machinery by hand, so nothing armed may merge it on green.
          if printf '%s\n' "$paths" | loop/rules.sh touches | grep -qx loop; then
            auto_merge=$(gh pr view "$pr" --json autoMergeRequest --jq '.autoMergeRequest != null') || fail "merge-ready: cannot read auto-merge on a loop PR"
            if [ "$auto_merge" = true ]; then
              gh pr merge "$pr" --disable-auto || fail "merge-ready: cannot disarm auto-merge on a loop PR"
            fi
          fi
          set +e
          out=$(loop/rules.sh merge-ready "$pr" 2>&1)
          code=$?
          set -e
          state=success
          if [ "$code" -ne 0 ]; then state=failure; fi
          if [ "$code" -eq 2 ]; then out="merge-ready not built"; fi
          desc=$(printf '%s' "$out" | head -n1 | cut -c1-140)
          gh api "repos/$REPO/statuses/$sha" -f state="$state" -f context=merge-ready -f description="${desc:-$state}"
