name: merge-ready

# Runs from the default branch's copy of this file and checks out the default branch only: a PR's
# own files are read as data and never executed (L46). The review workflow dispatches it after posting a verdict,
# since a comment posted with GITHUB_TOKEN starts no workflow.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [check, loop, visual]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true

permissions:
  # Disabling auto-merge requires repository write access; this job executes main only.
  contents: write
  statuses: write
  pull-requests: write
  checks: read

concurrency:
  group: merge-ready-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

# L82: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # Not named merge-ready: a job of that name would also publish a check run with the status's name.
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: set the merge-ready status on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_FROM_PR: ${{ github.event.pull_request.number }}
          PR_FROM_COMMENT: ${{ github.event.issue.pull_request && github.event.issue.number }}
          PR_FROM_DISPATCH: ${{ inputs.pr }}
          PR_FROM_RUN: ${{ github.event.workflow_run.pull_requests[0].number }}
          OWNER: ${{ github.repository_owner }}
        run: |
          pr="${PR_FROM_PR:-${PR_FROM_COMMENT:-${PR_FROM_DISPATCH:-$PR_FROM_RUN}}}"
          [ -n "$pr" ] || { echo "no pull request for this event"; exit 0; }
          sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
          fail() {
            gh api "repos/$REPO/statuses/$sha" -f state=failure -f context=merge-ready -f description="$1"
            echo "$1" >&2
            exit 1
          }
          paths=$(gh pr diff "$pr" --name-only) || fail "merge-ready: cannot read the PR diff"
          # L78: the user merges loop machinery by hand, so nothing armed may merge it on green.
          kinds=$(printf '%s\n' "$paths" | loop/rules.sh touches) || fail "merge-ready: cannot sort the PR's paths"
          if grep -qx loop <<<"$kinds"; then
            auto_merge=$(gh pr view "$pr" --json autoMergeRequest --jq '.autoMergeRequest != null') || fail "merge-ready: cannot read auto-merge on a loop PR"
            if [ "$auto_merge" = true ]; then
              gh pr merge "$pr" --disable-auto || fail "merge-ready: cannot disarm auto-merge on a loop PR"
            fi
          fi
          for _attempt in 1 2 3; do
            sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
            code=0
            out=$(loop/rules.sh merge-ready "$pr" 2>&1) || code=$?
            latest=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
            if [ "$latest" != "$sha" ]; then
              code=1
              out='PR changed during merge-ready'
            fi
            if ! grep -Fq 'PR changed during merge-ready' <<<"$out"; then break; fi
          done
          state=success
          if [ "$code" -ne 0 ]; then state=failure; fi
          if [ "$code" -eq 2 ]; then out="merge-ready not built"; fi
          desc=$(head -n1 <<<"$out" | cut -c1-140)
          gh api "repos/$REPO/statuses/$sha" -f state="$state" -f context=merge-ready -f description="${desc:-$state}"
          # L79: a reason only the user clears labels the PR flag:needs-user, assigns the owner and keeps one comment
          # asking it; a run with none left takes the label and the assignee off. Every reason line counts, not the first.
          asks=""
          ask() { if grep -Fq "$1" <<<"$out"; then asks+="- $2"$'\n'; fi; }
          # L81: a draft or closed PR asks only why its Builder stopped; every other question waits until it is ready.
          if ! grep -Fq 'PR is closed or draft' <<<"$out"; then
            ask 'the user merges a PR touching loop/, .github/, .agents/, .claude/, AGENTS.md or CLAUDE.md' 'It touches loop machinery: will you read it and merge it?'
            ask 'second reject: the user decides' 'Two rejects stand: will you fix it, merge it or close it?'
            # shellcheck disable=SC2016 # the backticks are Markdown
            ask 'a crates/desktop PR needs a macOS: line' 'It changes crates/desktop: did `just app` work on your Mac? If so, add a `macOS:` line to the body.'
          fi
          stopped=$(grep -m1 'the Builder stopped: ' <<<"$out" || true)
          stopped=${stopped#*the Builder stopped: }
          if [ -n "$stopped" ] && [[ "$stopped" != "the run ended without marking it ready,"* ]]; then
            asks+="- The Builder stopped (${stopped%.}): will you finish it, or close it and delete its branch to build it again?"$'\n'
          fi
          issue=$(gh api "repos/$REPO/issues/$pr")
          labelled=$(jq '[.labels[].name] | index("flag:needs-user") != null' <<<"$issue")
          assigned=$(jq --arg owner "$OWNER" '[.assignees[].login] | index($owner) != null' <<<"$issue")
          if [ -n "$asks" ]; then
            [ "$labelled" = true ] || gh api "repos/$REPO/issues/$pr/labels" -f 'labels[]=flag:needs-user' >/dev/null
            [ "$assigned" = true ] || gh api "repos/$REPO/issues/$pr/assignees" -f "assignees[]=$OWNER" >/dev/null
            body=$(printf '<!-- needs-user -->\nmerge-ready waits on you:\n\n%s' "$asks")
            comment=$(gh api "repos/$REPO/issues/$pr/comments?per_page=100" --paginate |
              jq -sc 'add | map(select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- needs-user -->")))) | first // empty | {id, body}')
            if [ -z "$comment" ]; then
              gh api "repos/$REPO/issues/$pr/comments" -f body="$body" >/dev/null
            elif [ "$(jq -r .body <<<"$comment")" != "$body" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$(jq -r .id <<<"$comment")" -f body="$body" >/dev/null
            fi
          else
            [ "$labelled" = false ] || gh api -X DELETE "repos/$REPO/issues/$pr/labels/flag:needs-user" >/dev/null
            [ "$assigned" = false ] || gh api -X DELETE "repos/$REPO/issues/$pr/assignees" -f "assignees[]=$OWNER" >/dev/null
          fi
