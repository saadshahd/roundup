name: check

on:
  # ready_for_review reruns check on a Builder's finished head, which starts its review (L24).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: just check
      - name: hello-world round trip (rup ping through rupd)
        run: |
          export RUPD_SOCKET="$RUNNER_TEMP/rupd.sock"
          cargo build -p rupd -p rup
          ./target/debug/rupd & 
          for _ in $(seq 20); do [ -S "$RUPD_SOCKET" ] && break; sleep 0.25; done
          ./target/debug/rup ping | grep -q pong
          kill %1
