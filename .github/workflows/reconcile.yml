name: reconcile

# Events minimise handoff latency; the periodic sweep recovers missed events.
on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [check, loop, build, review, visual, feedback]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: reconcile
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write
  pull-requests: write
  checks: read

defaults:
  run:
    shell: bash

jobs:
  reconcile:
    if: github.event_name != 'issues' || !contains(github.event.issue.labels.*.name, 'loop:status')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 loop/dispatch.py budget
      - if: steps.budget.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/loop-ledger-cache
          key: loop-ledger-v1-${{ github.run_id }}
          restore-keys: loop-ledger-v1-
      - name: Reconcile PRs and Builder queue
        if: steps.budget.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOOP_DAILY_TOKENS: ${{ vars.LOOP_DAILY_TOKENS }}
          LOOP_LEDGER_CACHE: ${{ runner.temp }}/loop-ledger-cache
          CODEX_STATUS: ${{ vars.LOOP_CODEX_STATUS }}
        run: |
          gh auth setup-git
          python3 loop/outcome.py report python3 loop/dispatch.py reconcile
      - name: Reconcile feedback publication and planning
        if: always() && steps.budget.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOOP_DAILY_TOKENS: ${{ vars.LOOP_DAILY_TOKENS }}
          LOOP_LEDGER_CACHE: ${{ runner.temp }}/loop-ledger-cache
        run: python3 loop/outcome.py report python3 loop/feedback.py reconcile

  summary:
    needs: [reconcile]
    if: always()
    permissions:
      actions: read
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Move eligible loop work forward
      next: Queued runs act automatically; blocked publication stays visible and the next sweep retries.
