name: reconcile

# Events minimise handoff latency; the periodic sweep recovers missed events.
on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [check, loop, build, review, visual, feedback]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: reconcile
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write
  pull-requests: write
  checks: read

defaults:
  run:
    shell: bash

jobs:
  reconcile:
    if: github.event_name != 'issues' || !contains(github.event.issue.labels.*.name, 'loop:status')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/loop-ledger-cache
          key: loop-ledger-v1-${{ github.run_id }}
          restore-keys: loop-ledger-v1-
      - env:
          GH_TOKEN: ${{ github.token }}
          LOOP_DAILY_TOKENS: ${{ vars.LOOP_DAILY_TOKENS }}
          LOOP_LEDGER_CACHE: ${{ runner.temp }}/loop-ledger-cache
          CODEX_STATUS: ${{ vars.LOOP_CODEX_STATUS }}
        run: |
          gh auth setup-git
          python3 loop/dispatch.py reconcile
          python3 loop/feedback.py reconcile
