name: status

# L80: rewrites Status every five minutes and on build/review/reconcile run events; an edit notifies no one. At
# 08:03 UTC, or on dispatch with daily, it also counts the tokens and posts the page as one comment, which notifies the
# user the issue is assigned to. A PR waiting on the user pings through merge-ready's assignment (L79), not here.
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '3 8 * * *'
  workflow_run:
    workflows: [build, review, reconcile, qa, retro, check, loop, visual]
    types: [requested, in_progress, completed]
  workflow_dispatch:
    inputs:
      daily:
        description: Count the tokens and post the page as a comment
        type: boolean
        default: false

permissions:
  contents: read

# A newer page replaces a running one; the daily run has its own group, so no burst cancels its comment.
concurrency:
  group: status-${{ (github.event.schedule == '3 8 * * *' || inputs.daily) && 'daily' || 'page' }}
  cancel-in-progress: ${{ !(github.event.schedule == '3 8 * * *' || inputs.daily) }}

# L82: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  page:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          CODEX_STATUS: ${{ vars.LOOP_CODEX_STATUS }}
          DAILY: ${{ github.event.schedule == '3 8 * * *' || inputs.daily }}
        run: |
          ACTIVITY=$(python3 loop/dispatch.py activity)
          export ACTIVITY
          issue=$(loop/status.sh issue)
          if [ "$DAILY" = true ]; then
            loop/status.sh page --cost >"$RUNNER_TEMP/page.md"
          else
            gh issue view "$issue" --json body --jq .body | loop/status.sh page >"$RUNNER_TEMP/page.md"
          fi
          gh issue edit "$issue" --body-file "$RUNNER_TEMP/page.md"
          if [ "$DAILY" = true ]; then gh issue comment "$issue" --body-file "$RUNNER_TEMP/page.md"; fi
