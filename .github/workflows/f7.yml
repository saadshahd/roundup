name: F7 observer
run-name: F7 isolated terminal evidence for PR 330

on:
  workflow_dispatch:

concurrency:
  group: f7-observer-330
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      # Audited isolated observer from PR 330; never execute an arbitrary input ref with OAuth.
      - uses: actions/checkout@v4
        with:
          ref: 2bf38afbe2f81a409ff47c554e3775405d81e1d1
          path: .f7-source
          sparse-checkout: spikes/spawn-boundary
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install observer tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux jq
          npm install -g @anthropic-ai/claude-code@2.1.295
      - name: Run isolated observer outside model Bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/f7"
          export TMPDIR="$RUNNER_TEMP/f7"
          timeout --signal=TERM --kill-after=30s 15m bash .f7-source/spikes/spawn-boundary/run-interactive.sh >"$RUNNER_TEMP/f7/run.log" 2>&1
      - name: Retain redacted evidence only
        if: always()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, sys
          from pathlib import Path
          source = Path(os.environ['RUNNER_TEMP']) / 'f7'
          target = Path(os.environ['RUNNER_TEMP']) / 'f7-evidence'
          target.mkdir(exist_ok=True)
          sys.path.insert(0, 'loop')
          from outcome import redact
          retained = []
          for case in ('i_base', 'i_proj', 'i_user', 'i_shim'):
              for suffix in ('.txt', '.version.txt'):
                  name = case + suffix
                  files = list(source.glob('roundup-f7.*/out/' + name))
                  if len(files) == 1:
                      (target / name).write_text(redact(files[0].read_text(), os.environ))
                      retained.append(name)
          log = source / 'run.log'
          if log.is_file():
              (target / 'run.log').write_text(redact(log.read_text(), os.environ))
          expected = {case + suffix for case in ('i_base', 'i_proj', 'i_user', 'i_shim') for suffix in ('.txt', '.version.txt')}
          (target / 'manifest.json').write_text(json.dumps(dict(
              head='2bf38afbe2f81a409ff47c554e3775405d81e1d1',
              run=os.environ['GITHUB_RUN_ID'], cli='2.1.295', files=retained,
              state='captured-not-judged', missing=sorted(expected - set(retained)),
              observer='Inspect every pane for login, trust, timeout and tool errors before any REPORT claim.'), indent=2))
          print('Retained evidence only; authentication and config files excluded. Captures require independent judgment.')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f7-${{ github.run_id }}
          path: ${{ runner.temp }}/f7-evidence
          retention-days: 14
          if-no-files-found: error

  summary:
    needs: [observe]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Capture F7 observer evidence
      next: The linked artifacts retain the experiment evidence for assessment; capture alone does not prove acceptance.
