name: Run explanation

on:
  workflow_call:
    inputs:
      results:
        type: string
        required: true
      purpose:
        type: string
        required: true
      next:
        type: string
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Explain this run
        env:
          RESULTS: ${{ inputs.results }}
          PURPOSE: ${{ inputs.purpose }}
          NEXT: ${{ inputs.next }}
        shell: python
        run: |
          import html
          import json
          import os
          import re

          results = json.loads(os.environ['RESULTS'])
          failed = any(job['result'] in ('failure', 'cancelled') for job in results.values())
          ran = any(job['result'] != 'skipped' for job in results.values())
          escape = html.escape
          result = ('Needs repair — failed or cancelled work below.' if failed else
                    'Jobs completed; delivery and approval are reported separately.' if ran else
                    'No work ran — all jobs were skipped.')
          run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          lines = [f"## {escape(os.environ['PURPOSE'])}", f'**Result:** {result}',
                   f"**Trigger:** {escape(os.environ['GITHUB_EVENT_NAME'])} · **Attempt:** {os.environ['GITHUB_RUN_ATTEMPT']}",
                   f'[Open jobs and failure details]({run})', '| Job | Result |', '| --- | --- |']
          lines.extend(f"| {escape(name)} | {escape(job['result'])} |" for name, job in results.items())
          for job in results.values():
              output = job.get('outputs', {})
              for field, path in (('pr', 'pull'), ('issue', 'issues')):
                  number = output.get(field, '')
                  if re.fullmatch(r'[1-9][0-9]*', str(number)):
                      lines.append(f"\n{field.upper()}: [#{number}]({os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/{path}/{number})")
              if re.fullmatch(r'[0-9a-f]{40}', output.get('head', '')):
                  lines.append(f"Head: `{output['head']}`")
          agents = [job for name, job in results.items() if name in ('build', 'fix-run', 'review-run', 'sweep')]
          if agents and all(job['result'] == 'skipped' for job in agents):
              lines.append('\n**No agent work ran.** Eligibility checks skipped the model work.')
          lines.extend([f"\n**Next:** {escape(os.environ['NEXT'])}",
                        '\nA model’s success claim is not proof of delivery.'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n\n'.join(lines[:4]) + '\n\n' + '\n'.join(lines[4:]) + '\n')
