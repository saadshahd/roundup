name: qa

# L66: sweeps main's harness (L52) every six hours on a runner holding no write token. It calls no model, so it sweeps
# even an unchanged main. A finding fails the run; the sweep record is its artifact.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: qa
  cancel-in-progress: false

permissions:
  contents: read

# L82: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: taiki-e/install-action@just
      - run: pnpm install --frozen-lockfile
      - run: |
          npm install -g agent-browser@0.27.0
          agent-browser install --with-deps
      - run: loop/qa-sweep.sh
      - name: a complete sweep record
        if: always()
        run: jq -se 'length > 0 and all(.complete)' loop/out/qa/sweep-*.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-sweep-${{ github.run_id }}
          path: loop/out/qa/
          if-no-files-found: error

  summary:
    needs: [sweep]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Observe main for regressions
      next: Observed defects become work for the loop; the next scheduled sweep observes main again.
