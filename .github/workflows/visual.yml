name: visual

# L36: the Percy build of every harness seed; builds on main are its baseline. The ruleset requires `percy` on every PR
# (L46), so a PR that leaves apps/desktop/src alone passes it without a build.
on:
  pull_request:
  push:
    branches: [main]
    paths: ['apps/desktop/src/**']
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# L82: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  percy:
    runs-on: ubuntu-latest
    steps:
      # A PR checks out a merge commit; its first parent is the base, so the diff to it is what the PR changes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: ui
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || git diff --name-only HEAD^1 HEAD | grep -q '^apps/desktop/src/'; then
            echo 'changed=true' >>"$GITHUB_OUTPUT"
          else
            echo 'The PR leaves apps/desktop/src alone: no Percy build.'
          fi
      - if: steps.ui.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.ui.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.ui.outputs.changed == 'true'
        uses: taiki-e/install-action@just
      - if: steps.ui.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      # The build's commit is the PR head, not the merge commit checked out, so review finds it by the head's SHA (L24).
      - if: steps.ui.outputs.changed == 'true'
        run: loop/percy.sh snapshot
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PERCY_BRANCH: ${{ github.head_ref || github.ref_name }}
          PERCY_CLIENT_ERROR_LOGS: "false"

  summary:
    needs: [percy]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Check rendered UI changes
      next: Review uses the visual evidence; required Percy results remain a merge gate.
